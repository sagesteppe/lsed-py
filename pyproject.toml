[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lsed"
version = "0.0.0.dev0"
description = "Prevalence-corrected evaluation of species-distribution predictions."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Reed Benkendorf", email = "reedbenkendorf2021@u.northwestern.edu" },
]
keywords = [
    "decision-curve-analysis",
    "species-distribution-model",
    "prevalence",
    "average-precision",
    "calibration",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "pandas>=1.3",
    "statsmodels>=0.13",
    "shapely>=2.0",
    "geopandas>=0.12",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/sagesteppe/lsed"
Repository = "https://github.com/sagesteppe/lsed"
"Bug Tracker" = "https://github.com/sagesteppe/lsed/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
